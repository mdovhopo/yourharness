# XcodeGen: `xcodegen generate` makes YourHarnessMobile.xcodeproj (not committed).
# scripts/mobile.sh does that, builds, and runs it in a Simulator.
name: YourHarnessMobile
options:
  bundleIdPrefix: com.mdovhopo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  YourHarnessMobile:
    type: application
    platform: iOS
    sources: [YourHarness]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdovhopo.yourharness.mobile
        PRODUCT_NAME: YourHarness
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # The icon (scripts/icons.sh): Next (night blue) for local builds and TestFlight; the App
        # Store build sets ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon (graphite).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconNext
        INFOPLIST_KEY_CFBundleDisplayName: YourHarness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad: every way up, so it can share the screen (Split View, Stage Manager).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: YourHarness connects to your Mac to show its threads.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: YourHarness listens while you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: YourHarness writes what you say into the message you're typing.
        INFOPLIST_KEY_NSCameraUsageDescription: YourHarness reads your Mac's pairing code with the camera.
    info:
      path: YourHarness/Info.plist
      properties:
        # ws:// to the Mac on the local network (and 127.0.0.1 from the Simulator), and over
        # Tailscale by its MagicDNS name: ATS counts only private ranges as local, not the
        # tailnet's 100.64/10, and an exception can't name an IP; WireGuard encrypts that way.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # yourharness://pair?… from the Mac's QR code: the Camera app opens the app with it.
        CFBundleURLTypes:
          - CFBundleURLName: com.mdovhopo.yourharness.mobile.pair
            CFBundleURLSchemes: [yourharness]
schemes:
  YourHarnessMobile:
    build:
      targets:
        YourHarnessMobile: all
    run:
      config: Debug
