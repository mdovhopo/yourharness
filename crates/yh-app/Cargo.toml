[package]
name = "yh-app"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "YourHarness: the app on GPUI."

[[bin]]
name = "YourHarness"
path = "src/main.rs"

[dependencies]
imagesize = "0.14"
yh-core.workspace = true
yh-engine.workspace = true
yh-server.workspace = true
yh-voice.workspace = true
gpui-kit = "=0.9.0"
serde_json.workspace = true
flume.workspace = true
libc.workspace = true
objc = "0.2"
block = "0.1"
cocoa = "0.26"
core-foundation = "0.10"
raw-window-handle = "0.6"
# Copy Image and Save as PNG for diagrams: the version GPUI already builds.
resvg = "0.46"
# The Files tab's folder watch (FSEvents): the version gpui-component already builds.
notify = "8.2"
# Settings → Phone: the pairing link as a QR code, drawn as squares.
qrcode = { version = "0.14", default-features = false }
# Only for the snapshots feature: the same GPUI gpui-kit pins, with its test support turned on.
gpui = { package = "gpui-pre", version = "=0.3.11", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", optional = true }
# Demo recordings (demo.rs): the browser's page, captured as JPEG, decoded into the frame.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }

[features]
# Test builds: `Window::render_to_image` for YH_SNAPSHOT (screencapture would prompt the user).
snapshots = ["dep:gpui", "dep:gpui_platform", "dep:image", "gpui/test-support", "gpui_platform/test-support"]
