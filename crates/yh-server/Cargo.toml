[package]
name = "yh-server"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "YourHarness's server for its clients (the phone app): threads, rows and what runs, live, and actions, over a WebSocket."

[dependencies]
yh-core.workspace = true
yh-engine.workspace = true
yh-proto.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
flume.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

